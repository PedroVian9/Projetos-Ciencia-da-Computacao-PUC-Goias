<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agenda de Contatos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Agenda de Contatos — PUC Goiás</h1>
        <p>Organize seus contatos em um só lugar.</p>
        <form>
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" placeholder="Nome completo" required />
          <label for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="tel" placeholder="(62) 99999-9999" required />
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="nome@exemplo.com" required />
          <button type="submit">Adicionar contato</button>
        </form>
      </section>
      <section class="card contatos">
        <h2>Contatos cadastrados</h2>
        <ul>
          <li><strong>Ana Souza</strong><span>ana@exemplo.com · (62) 99999-1234</span></li>
          <li><strong>Bruno Lima</strong><span>bruno@exemplo.com · (62) 98888-5678</span></li>
        </ul>
      </section>
    </main>
  </body>
</html>
